[project]
name = "v6-infrastructure-sh"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    # vantage6 client — needed to run run_study.py scripts
    "vantage6",
    # algorithm tools — needed to lint/test algorithm code locally
    "vantage6-algorithm-tools==4.14.0",
    "pandas",
    "numpy",
    "torch",
    "matplotlib",
    "scikit-learn",
    # data/ synthetic data generation tooling
    "datavalgen @ git+https://github.com/mdw-nl/datavalgen.git@v0.4.4",
    "datavalgen-model-beach @ git+https://github.com/MaastrichtU-CDS/datavalgen-model-beach.git",
    "nibabel",
    "scipy",
    "pytest",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
